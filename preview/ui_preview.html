<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTP Watcher UI Preview</title>
  <style>
    :root { --primary:#1E3A8A; --bg:#F8FAFC; --surface:#fff; --muted:#475569; --line:#E2E8F0; --chip:#DBEAFE; --warn:#EA580C; }
    body { margin:0; background:var(--bg); font-family: Inter,system-ui,Arial,sans-serif; }
    .phone { width:390px; margin:20px auto; border:1px solid #cbd5e1; border-radius:26px; overflow:hidden; box-shadow:0 20px 50px rgba(15,23,42,.15); background:var(--bg); }
    .toolbar { background:var(--primary); color:#fff; padding:16px; font-weight:700; font-size:20px; }
    .content { padding:14px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
    .title { color:#0F172A; font-weight:700; font-size:18px; }
    .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    .chips { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
    .chip { background:var(--chip); color:var(--primary); font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; }
    .section { font-weight:700; color:#0F172A; margin:10px 0 8px; }
    .event { display:flex; gap:12px; }
    .icon { width:42px; height:42px; border-radius:10px; background:var(--chip); }
    .meta { flex:1; }
    .row { display:flex; align-items:center; justify-content:space-between; }
    .app { font-weight:700; color:#0F172A; }
    .warn { color:var(--warn); font-size:12px; font-weight:700; margin-top:2px; }
    .pkg,.time { color:var(--muted); font-size:12px; }
    .msg { color:#0F172A; font-size:13px; margin-top:6px; }
    .method { background:var(--chip); color:var(--primary); font-size:11px; padding:3px 8px; border-radius:999px; font-weight:700; }
    .fab { position:absolute; right:24px; bottom:26px; width:54px; height:54px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:22px; box-shadow:0 10px 25px rgba(30,58,138,.35); }
    .stage { position:relative; padding-bottom:70px; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="toolbar">OTP Watcher</div>
    <div class="content stage">
      <div class="card">
        <div class="title">Monitoring is active</div>
        <div class="sub">Total: 2 • Suspicious: 1</div>
        <div class="chips"><span class="chip">SMS</span><span class="chip">Usage Stats</span><span class="chip">Notifications</span></div>
      </div>
      <div class="section">OTP Access Log</div>
      <div class="card event">
        <div class="icon"></div>
        <div class="meta">
          <div class="row"><div class="app">Secure Bank</div><div>⚠️</div></div>
          <div class="warn">Suspicious access</div>
          <div class="pkg">com.bank.app</div>
          <div class="msg">Your OTP is 123456. Valid for 2 minutes.</div>
          <div class="row" style="margin-top:8px"><div class="time">Aug 21, 12:04:51</div><div class="method">SMS</div></div>
        </div>
      </div>
      <div class="card event">
        <div class="icon"></div>
        <div class="meta">
          <div class="row"><div class="app">UPI Wallet</div></div>
          <div class="pkg">com.upi.wallet</div>
          <div class="msg">Use code 875421 to complete payment.</div>
          <div class="row" style="margin-top:8px"><div class="time">Aug 21, 12:02:51</div><div class="method">SMS</div></div>
        </div>
      </div>
      <div class="fab">🗑</div>
    </div>
  </div>
</body>
</html>
